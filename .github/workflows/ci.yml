name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: shells for the hook tests (pwsh is preinstalled on these runners)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh fish
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  homebrew:
    name: homebrew formula
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build && python packaging/render.py --local
      - name: install + test from a local tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew tap-new --no-git local/redo
          cp dist/homebrew/redo-cli.rb "$(brew --repository)/Library/Taps/local/homebrew-redo/Formula/"
          brew install --formula local/redo/redo-cli
          brew test local/redo/redo-cli
          brew style local/redo/redo-cli
          "$(brew --prefix)/bin/redo" --version
