[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redo-cli"
version = "0.1.0"
description = "Terminal-native tool that explains why a command failed and gives a direct fix."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["cli", "developer-tools", "debugging", "shell", "terminal", "errors"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.scripts]
redo = "redo_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["redo_cli*"]
